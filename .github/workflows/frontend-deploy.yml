name: Frontend Deploy VPS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Frontend CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: fe-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_SHA="$(git rev-parse HEAD)"
          RELEASE_TAG="sha-$RELEASE_SHA"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$RELEASE_TAG"
            if [ "$SOURCE_BRANCH" = "main" ]; then
              echo "$IMAGE_NAME:main"
              echo "$IMAGE_NAME:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR for push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push frontend image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || '/api' }}
            NEXT_PUBLIC_WEAVEY_API_URL=${{ vars.NEXT_PUBLIC_WEAVEY_API_URL }}
            NEXT_PUBLIC_RAG_API_BASE_URL=${{ vars.NEXT_PUBLIC_RAG_API_BASE_URL || 'https://weavecarbon.com/rag' }}
            NEXT_PUBLIC_RAG_COLLECTION=${{ vars.NEXT_PUBLIC_RAG_COLLECTION }}
            NEXT_PUBLIC_RAG_COLUMNS_TO_ANSWER=${{ vars.NEXT_PUBLIC_RAG_COLUMNS_TO_ANSWER || 'chunk' }}
            NEXT_PUBLIC_RAG_NUMBER_DOCS_RETRIEVAL=${{ vars.NEXT_PUBLIC_RAG_NUMBER_DOCS_RETRIEVAL || '3' }}
            NEXT_PUBLIC_RAG_TIMEOUT_MS=${{ vars.NEXT_PUBLIC_RAG_TIMEOUT_MS || '30000' }}
            NEXT_PUBLIC_MAPBOX_TOKEN=${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN || vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
            NEXT_PUBLIC_MAPBOX_GEOCODING_BASE_URL=${{ vars.NEXT_PUBLIC_MAPBOX_GEOCODING_BASE_URL || 'https://api.mapbox.com/geocoding/v5/mapbox.places' }}
            NEXT_PUBLIC_AUTH_DISABLED=${{ vars.NEXT_PUBLIC_AUTH_DISABLED || '0' }}
            NEXT_PUBLIC_ACCOUNT_ENDPOINT=${{ vars.NEXT_PUBLIC_ACCOUNT_ENDPOINT }}
            NEXT_PUBLIC_ENFORCE_CLIENT_ROLE_GUARD=${{ vars.NEXT_PUBLIC_ENFORCE_CLIENT_ROLE_GUARD || '0' }}

      - name: Scan immutable frontend image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Enforce frontend image policy
        shell: bash
        run: |
          set -euo pipefail
          image='${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'
          docker pull "$image"
          bytes="$(docker image inspect "$image" --format '{{.Size}}')"
          user="$(docker image inspect "$image" --format '{{.Config.User}}')"
          test -n "$user" && test "$user" != '0' && test "$user" != 'root'
          test "$bytes" -le 367001600
          echo "Frontend image bytes: $bytes; runtime user: $user" >> "$GITHUB_STEP_SUMMARY"

      - name: Record release evidence
        shell: bash
        run: |
          {
            echo '### Frontend immutable release'
            echo
            echo '- Source: `${{ steps.release.outputs.sha }}`'
            echo '- Image: `${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}`'
            echo '- SBOM and provenance: attached OCI attestations'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check deploy secrets
        id: deploy_secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!var:-}" ]]; then
              echo "::warning title=Missing secret::$var is not configured. Skipping deploy."
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Fail when deploy secrets are missing
        if: steps.deploy_secrets.outputs.missing != '0'
        run: |
          echo "::error title=Missing deploy secrets::Configure DEPLOY_HOST, DEPLOY_USER and DEPLOY_SSH_KEY for the production environment."
          exit 1

      - name: Configure SSH
        id: ssh
        if: steps.deploy_secrets.outputs.missing == '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error title=Invalid SSH key::DEPLOY_SSH_KEY is not a valid OpenSSH private key."
            exit 1
          fi
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          if ssh-keyscan -H -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/tmp/keyscan.log && [ -s ~/.ssh/known_hosts ]; then
            chmod 644 ~/.ssh/known_hosts
            echo "reachable=1" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=VPS unreachable::Could not fetch host key from ${DEPLOY_HOST}:${DEPLOY_PORT}. Check DEPLOY_HOST/DEPLOY_PORT and that the VPS SSH port is reachable from GitHub Actions."
            cat /tmp/keyscan.log || true
            exit 1
          fi

      - name: Deploy frontend on VPS
        if: steps.deploy_secrets.outputs.missing == '0' && steps.ssh.outputs.reachable == '1'
        shell: bash
        run: |
          set -euo pipefail
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          REMOTE_FE_IMAGE="${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
          GHCR_TOKEN_B64="$(printf '%s' "${GHCR_TOKEN:-}" | base64 -w0)"

          ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            -T -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "FE_IMAGE='$REMOTE_FE_IMAGE' GHCR_USERNAME='$GHCR_USERNAME' GHCR_TOKEN_B64='$GHCR_TOKEN_B64' bash --noprofile --norc -se" <<'EOF'
          set -euo pipefail

          if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN_B64:-}" ]; then
            GHCR_TOKEN="$(printf '%s' "$GHCR_TOKEN_B64" | base64 -d)"
            echo "[deploy] Logging in to GHCR as ${GHCR_USERNAME}"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          else
            echo "[deploy] ERROR: Missing GHCR credentials. Set GHCR_USERNAME/GHCR_TOKEN or allow GITHUB_TOKEN package access."
            exit 1
          fi

          cd /opt/weavecarbon/FE
          git checkout main
          git pull --ff-only origin main

          PREVIOUS_FE_IMAGE="$(grep '^FE_IMAGE=' .env.vps | cut -d= -f2- || true)"
          if grep -q '^FE_IMAGE=' .env.vps; then
            sed -i "s|^FE_IMAGE=.*|FE_IMAGE=${FE_IMAGE}|" .env.vps
          else
            printf 'FE_IMAGE=%s\n' "$FE_IMAGE" >> .env.vps
          fi

          export FE_IMAGE
          if ! bash deploy/redeploy-vps.sh --frontend-only; then
            echo "[deploy] Frontend smoke failed; restoring previous immutable image."
            if [ -n "$PREVIOUS_FE_IMAGE" ]; then
              sed -i "s|^FE_IMAGE=.*|FE_IMAGE=${PREVIOUS_FE_IMAGE}|" .env.vps
              export FE_IMAGE="$PREVIOUS_FE_IMAGE"
              bash deploy/redeploy-vps.sh --frontend-only
            fi
            exit 1
          fi
          printf '%s frontend %s %s\n' "$(date -u +%FT%TZ)" '${{ steps.release.outputs.sha }}' "$FE_IMAGE" >> .deploy-history
          EOF
