name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Scan source and lockfile
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: frontend-source-sbom.spdx.json
          artifact-name: frontend-source-sbom-${{ github.run_id }}.spdx.json

  compose-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose model
        run: docker compose --env-file .env.vps.example -f docker-compose.vps.yml config --quiet

      - name: Enforce isolation and immutable image inputs
        shell: bash
        run: |
          set -euo pipefail
          compose_json="$(docker compose --env-file .env.vps.example -f docker-compose.vps.yml config --format json)"
          python -c '
          import json, sys
          model = json.load(sys.stdin)
          services = model["services"]
          assert "ports" not in services["db"]
          assert "ports" not in services["be"]
          assert "ports" not in services["rag"]
          assert services["be"]["read_only"] is True
          assert services["rag"]["read_only"] is True
          assert services["fe"]["read_only"] is True
          assert services["db"]["networks"] == {"data": None}
          assert "data" not in services["proxy"]["networks"]
          assert "build" not in services["rag"]
          ' <<< "$compose_json"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (advisory — does NOT block the push)
        # Non-blocking on purpose: a newly-published advisory in a transitive dep
        # must not block an unrelated code push. Enforcement lives elsewhere:
        #   • Dependabot opens fix PRs automatically (.github/dependabot.yml)
        #   • the weekly "Dependency Audit (scheduled)" workflow files a tracking issue
        # The result still shows here as a visible signal.
        # Keep this advisory signal bounded so registry latency cannot cancel the
        # whole CI run and block an otherwise valid production deployment.
        run: timeout 180s npx audit-ci --config ./audit-ci.jsonc
        continue-on-error: true

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend contract
        uses: actions/checkout@v4
        with:
          repository: DauDinhQuangAnh/BE_weavecarbon
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Backend OpenAPI staleness check
        env:
          BACKEND_OPENAPI_PATH: ../backend/openapi/openapi.json
        run: npm run contract:check:backend
        working-directory: frontend

  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Enforce client bundle budgets
        run: npm run performance:check
