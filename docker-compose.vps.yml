name: weavecarbon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${BACKEND_SCHEMA_PATH:-../BE_Carbon-main/DATABASE_SCHEMA.sql}:/docker-entrypoint-initdb.d/01_database_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  be:
    image: ${BE_IMAGE:-ghcr.io/daudinhquanganh/be_weavecarbon:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      FRONTEND_URL: ${APP_PUBLIC_URL}
      FRONTEND_URLS: ${FRONTEND_URLS}
      CORS_ORIGIN: ${CORS_ORIGIN}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_PUBLIC_BASE_URL: ${APP_PUBLIC_URL}
      API_BASE_URL: ${APP_PUBLIC_URL}
      BACKEND_URL: ${APP_PUBLIC_URL}
      VNPAY_MODE: ${VNPAY_MODE:-mock}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_QUERYDR_URL: ${VNPAY_QUERYDR_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: ${APP_PUBLIC_URL}/api/subscription/vnpay/return
      VNPAY_IPN_URL: ${APP_PUBLIC_URL}/api/subscription/vnpay/ipn
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${APP_PUBLIC_URL}/api/auth/google/callback
      RAG_PROXY_ALLOWED_BASE_URLS: ${RAG_PROXY_ALLOWED_BASE_URLS:-https://weavecarbon.com/rag,https://www.weavecarbon.com/rag}
      RAG_PROXY_INTERNAL_BASE_URL: ${RAG_PROXY_INTERNAL_BASE_URL:-http://rag:8000}
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?RAG_INTERNAL_API_KEY must be set}
      RAG_REQUIRE_INTERNAL_API_KEY: "true"
    volumes:
      - be_uploads:/app/uploads
    networks:
      - app
      - data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s

  rag:
    image: ${RAG_IMAGE:-ghcr.io/daudinhquanganh/weavecarbon-rag:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CHROMA_DB_PATH: /app/db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite-preview}
      HF_TOKEN: ${HF_TOKEN:-}
      ROOT_PATH: ${RAG_ROOT_PATH:-}
      RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:-}
      RAG_INTERNAL_API_KEY: ${RAG_INTERNAL_API_KEY:?RAG_INTERNAL_API_KEY must be set}
      RAG_REQUIRE_INTERNAL_API_KEY: "true"
    expose:
      - "8000"
    volumes:
      - rag_data:/app/db
      - rag_cache:/app/.cache
    networks:
      - app
      - data
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 45s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready').read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  fe:
    image: ${FE_IMAGE:-ghcr.io/daudinhquanganh/weavecarbon:latest}
    restart: unless-stopped
    depends_on:
      be:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_HEALTH_URL: ${BACKEND_HEALTH_URL:-http://be:4000/ready}
      AI_CONFIG_CONSOLE_ENABLED: ${AI_CONFIG_CONSOLE_ENABLED:-0}
    networks:
      - app
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      be:
        condition: service_healthy
      fe:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "${PROXY_HTTP_BIND:-0.0.0.0}:${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_BIND:-0.0.0.0}:${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/extra-sites:/etc/caddy/extra-sites:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - app
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  be_uploads:
  rag_data:
  rag_cache:
  caddy_data:
  caddy_config:
