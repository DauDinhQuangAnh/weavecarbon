services:
  fe:
    container_name: weavecarbon-fe
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_WEAVEY_API_URL: ${NEXT_PUBLIC_WEAVEY_API_URL:-}
        NEXT_PUBLIC_RAG_API_BASE_URL: ${NEXT_PUBLIC_RAG_API_BASE_URL:-https://weavecarbon.com/rag}
        NEXT_PUBLIC_RAG_COLLECTION: ${NEXT_PUBLIC_RAG_COLLECTION:-}
        NEXT_PUBLIC_RAG_COLUMNS_TO_ANSWER: ${NEXT_PUBLIC_RAG_COLUMNS_TO_ANSWER:-chunk}
        NEXT_PUBLIC_RAG_NUMBER_DOCS_RETRIEVAL: ${NEXT_PUBLIC_RAG_NUMBER_DOCS_RETRIEVAL:-3}
        NEXT_PUBLIC_RAG_TIMEOUT_MS: ${NEXT_PUBLIC_RAG_TIMEOUT_MS:-30000}
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
        NEXT_PUBLIC_MAPBOX_GEOCODING_BASE_URL: ${NEXT_PUBLIC_MAPBOX_GEOCODING_BASE_URL:-https://api.mapbox.com/geocoding/v5/mapbox.places}
        NEXT_PUBLIC_AUTH_DISABLED: ${NEXT_PUBLIC_AUTH_DISABLED:-0}
        NEXT_PUBLIC_ACCOUNT_ENDPOINT: ${NEXT_PUBLIC_ACCOUNT_ENDPOINT:-}
        NEXT_PUBLIC_ENFORCE_CLIENT_ROLE_GUARD: ${NEXT_PUBLIC_ENFORCE_CLIENT_ROLE_GUARD:-}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BACKEND_HEALTH_URL: ${BACKEND_HEALTH_URL:-}
      AI_CONFIG_CONSOLE_ENABLED: ${AI_CONFIG_CONSOLE_ENABLED:-0}
    ports:
      - "3000:3000"
    restart: unless-stopped
